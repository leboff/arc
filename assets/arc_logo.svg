<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Spatial OLED Dark Slate Canvas -->
    <radialGradient id="canvasGrad" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="55%" stop-color="#090B10"/>
      <stop offset="100%" stop-color="#030406"/>
    </radialGradient>

    <!-- Volumetric Aperture Glow -->
    <radialGradient id="backlightGlow" cx="50%" cy="46%" r="40%">
      <stop offset="0%" stop-color="#6FD8EC" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#1E65F8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#090B10" stop-opacity="0"/>
    </radialGradient>

    <!-- Main Arc: Continuous Luminous Cyan -> Electric Cobalt -> Royal Sapphire -->
    <linearGradient id="mainArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FAFF"/>
      <stop offset="25%" stop-color="#6FD8EC"/>
      <stop offset="65%" stop-color="#1E65F8"/>
      <stop offset="100%" stop-color="#0B2368"/>
    </linearGradient>

    <!-- Precision Specular Crest Highlight -->
    <linearGradient id="crestSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#6FD8EC" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1E65F8" stop-opacity="0"/>
    </linearGradient>

    <!-- Frosted Glass Play Glyph -->
    <linearGradient id="frostedPlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#C5F6FF"/>
      <stop offset="75%" stop-color="#6FD8EC"/>
      <stop offset="100%" stop-color="#2D7DF6"/>
    </linearGradient>

    <!-- 3D Shadow -->
    <filter id="spatialShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <!-- Neon Glow Filter -->
    <filter id="cyanGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#canvasGrad)" stroke="#1B2232" stroke-width="2"/>
  
  <!-- Subtle Top Rim Sheen on Squircle -->
  <path d="M 24 130 C 24 70, 70 24, 130 24 L 382 24 C 442 24, 488 70, 488 130" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.15"/>

  <!-- Ambient Volumetric Light at Center -->
  <circle cx="256" cy="244" r="160" fill="url(#backlightGlow)"/>

  <!-- ================= HERO MONOMARK: THE ARC (Nudged up for optical center) ================= -->
  <g filter="url(#spatialShadow)" transform="translate(0, -12)">

    <!-- 1. The Sweeping Parabolic Arc (Cinema Screen / 'A' Canopy) -->
    <path d="M 124 384 
             C 124 208, 178 96, 256 96 
             C 334 96, 388 208, 388 384
             C 356 376, 336 348, 336 304
             C 336 200, 298 152, 256 152
             C 214 152, 176 200, 176 304
             C 176 348, 156 376, 124 384 Z"
          fill="url(#mainArcGrad)"/>

    <!-- 2. Precision Glass Specular Ridge (Outer Apex Contour) -->
    <path d="M 134 350 C 146 204, 192 98, 256 98 C 320 98, 366 204, 378 350" 
          fill="none" 
          stroke="url(#crestSheen)" 
          stroke-width="3" 
          stroke-linecap="round"/>

    <!-- 3. Floating Frosted-Glass Play Glyph (▶) -->
    <g filter="url(#cyanGlow)">
      <path d="M 232 208 
               C 232 201, 239 197, 245 200 
               L 315 248 
               C 322 252, 322 260, 315 264 
               L 245 312 
               C 239 315, 232 311, 232 304 
               Z"
            fill="url(#frostedPlay)"/>
      
      <!-- Inner Specular Light Refraction across Top Corner -->
      <path d="M 234 212 
               C 236 210, 240 209, 243 211 
               L 310 256 
               L 234 256 
               Z" 
            fill="#FFFFFF" 
            opacity="0.42"/>
    </g>

  </g>
</svg>
