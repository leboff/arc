<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Volumetric Ambient Light Beneath the Vault -->
    <radialGradient id="rainbowMarkGlow" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.30"/>
      <stop offset="35%" stop-color="#8B3DFF" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#FF2A6D" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Wide Panoramic Rainbow Spectral Gradient (Equalized Luminance) -->
    <linearGradient id="vibrantRainbowMark" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FF2A6D"/>
      <stop offset="14%" stop-color="#FF6B00"/>
      <stop offset="28%" stop-color="#FFD000"/>
      <stop offset="42%" stop-color="#00F59B"/>
      <stop offset="58%" stop-color="#00D2FF"/>
      <stop offset="72%" stop-color="#2D7FF9"/>
      <stop offset="86%" stop-color="#8B3DFF"/>
      <stop offset="100%" stop-color="#FF2AE0"/>
    </linearGradient>

    <!-- Top Edge Specular Glint along the Rainbow Curve -->
    <linearGradient id="crestSheenMark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Frosted Play Glyph Gradient -->
    <linearGradient id="frostedPlayMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2FAFF"/>
      <stop offset="80%" stop-color="#9CEBFF"/>
      <stop offset="100%" stop-color="#46C2EC"/>
    </linearGradient>

    <!-- Drop Shadow for Float Effect -->
    <filter id="spatialShadowMark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="cyanGlowMark" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Spectral Glow Beneath Rainbow Vault -->
  <circle cx="256" cy="275" r="180" fill="url(#rainbowMarkGlow)"/>

  <!-- ================= HERO MONOMARK: PANORAMIC RAINBOW ================= -->
  <g filter="url(#spatialShadowMark)" transform="translate(0, 18)">

    <!-- 1. The Broad Pure Panoramic Rainbow Arch -->
    <path d="M 64 340 
             C 64 196, 150 148, 256 148 
             C 362 148, 448 196, 448 340 
             A 22 22 0 0 1 404 340 
             C 404 220, 338 192, 256 192 
             C 174 192, 108 220, 108 340 
             A 22 22 0 0 1 64 340 Z"
          fill="url(#vibrantRainbowMark)"/>

    <!-- 2. Crisp Glass Specular Rim Highlight on Outer Contour -->
    <path d="M 76 324 C 90 206, 162 150, 256 150 C 350 150, 422 206, 436 324" 
          fill="none" 
          stroke="url(#crestSheenMark)" 
          stroke-width="3.5" 
          stroke-linecap="round"/>

    <!-- 3. Centered Frosted-Glass Play Chevron (▶) -->
    <g filter="url(#cyanGlowMark)">
      <path d="M 230 232 
               C 230 224, 238 219, 245 223 
               L 316 264 
               C 324 268, 324 278, 316 282 
               L 245 323 
               C 238 327, 230 322, 230 314 
               Z"
            fill="url(#frostedPlayMark)"/>
      
      <!-- Inner Specular Light Refraction across Top Facet -->
      <path d="M 233 236 
               C 235 233, 239 232, 243 234 
               L 310 273 
               L 233 273 
               Z" 
            fill="#FFFFFF" 
            opacity="0.45"/>
    </g>

  </g>
</svg>
